[project]
name = "qq-group-overlap"
version = "0.2.0"
description = "Find members shared by selected QQ groups."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qq-group-overlap = "qq_group_overlap.__main__:main"
qq-group-overlap-gui = "qq_group_overlap.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
